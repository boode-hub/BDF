[workspace]
members = ["crates/bdf-core", "crates/bdf"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
authors = ["BOoDe007"]
repository = "https://github.com/BOoDe007/BDF"

[workspace.dependencies]
bdf-core = { path = "crates/bdf-core" }
pdfium-render = { version = "0.9.4", default-features = false, features = ["pdfium_7881"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true

# Optimise dependencies even in debug builds so rendering stays usable while developing.
[profile.dev.package."*"]
opt-level = 2
