[package]
name = "bdf"
description = "BDF: a fast, portable PDF reader"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[[bin]]
name = "bdf"
path = "src/main.rs"

[dependencies]
bdf-core.workspace = true
serde.workspace = true
serde_json.workspace = true
log.workspace = true
eframe = { version = "0.37", default-features = false, features = ["accesskit", "clipboard", "default_fonts", "links", "wayland", "x11", "glow", "wgpu"] }
rfd = "0.15"
raw-window-handle = "0.6"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Storage_Xps", "Win32_UI_Controls_Dialogs", "Win32_System_ProcessStatus", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging", "Win32_System_Console"] }


[build-dependencies]
winresource = "0.1"

[lints]
workspace = true
