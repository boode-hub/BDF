name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  PDFIUM_BUILD: "8076"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  build-test-bench:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win-x64
          - os: ubuntu-latest
            platform: linux-x64
          - os: macos-latest
            platform: mac-arm64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Linux packages
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb xdotool imagemagick libxkbcommon-x11-0 libgl1 libegl1 mesa-vulkan-drivers zip
      - name: Fetch PDFium
        run: scripts/fetch_pdfium.sh ${{ matrix.platform }}
      - name: Unit and engine tests
        run: BDF_PDFIUM="$PWD/.pdfium" cargo test --workspace --release
      - name: Build release
        run: cargo build --release -p bdf
      - name: Benchmark (real app, 2000 pages)
        run: |
          cp .pdfium/*pdfium* target/release/
          mkdir -p bench-data
          export BDF_DATA_DIR="$PWD/bench-data"
          mkdir -p shots
          if [ "$RUNNER_OS" = "Linux" ]; then
            BDF_BENCH_SHOTS="$PWD/shots" xvfb-run -a -s "-screen 0 1600x1000x24" target/release/bdf --bench --report bench.json
          else
            target/release/bdf --bench --report bench.json
          fi
          python3 scripts/check_bench.py bench.json || {
            echo "--- warnings and errors from bench-data/bdf.log ---"
            grep -E "WARN|ERROR" bench-data/bdf.log | tail -40 || true
            exit 1
          }
      - name: UI test (real clicks on the real app)
        if: runner.os == 'Linux'
        run: scripts/ui_smoke.sh target/release/bdf shots
      - name: Package portable zip
        run: scripts/package.sh ${{ matrix.platform }}
      - uses: actions/upload-artifact@v4
        # Also on failure: the report, log and screenshots are what explain it.
        if: always()
        with:
          name: BDF-${{ matrix.platform }}
          path: |
            dist/*.zip
            bench.json
            bench-data/bdf.log
            shots/*.png
          if-no-files-found: warn

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [lint, build-test-bench]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*.zip
