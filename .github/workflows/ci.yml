name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  PDFIUM_BUILD: "8076"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  build-test-bench:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win-x64
          - os: ubuntu-latest
            platform: linux-x64
          - os: macos-latest
            platform: mac-arm64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Linux packages
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb xdotool imagemagick libxkbcommon-x11-0 libgl1 libegl1 mesa-vulkan-drivers zip
      - name: Fetch PDFium
        run: scripts/fetch_pdfium.sh ${{ matrix.platform }}
      - name: Unit and engine tests
        run: BDF_PDFIUM="$PWD/.pdfium" cargo test --workspace --release
      - name: Build release
        run: cargo build --release -p bdf
      - name: Benchmark (real app, 2000 pages)
        # No pdfium next to the executable: the built-in copy is what ships, so that is what is measured.
        run: |
          # The first run of a new executable, and the first load of the PDFium
          # it writes out, are slow (antivirus scan, macOS checks); that is not
          # BDF's start-up, so do both once beforehand, into the same data folder.
          mkdir -p bench-data
          export BDF_DATA_DIR="$PWD/bench-data"
          target/release/bdf --generate 3 warmup.pdf
          target/release/bdf --list-annotations warmup.pdf
          mkdir -p shots
          if [ "$RUNNER_OS" = "Linux" ]; then
            BDF_BENCH_SHOTS="$PWD/shots" xvfb-run -a -s "-screen 0 1600x1000x24" target/release/bdf --bench --report bench.json
          else
            target/release/bdf --bench --report bench.json
          fi
          python3 scripts/check_bench.py bench.json || {
            echo "--- warnings and errors from bench-data/bdf.log ---"
            grep -E "WARN|ERROR" bench-data/bdf.log | tail -40 || true
            exit 1
          }
      - name: UI test (real clicks on the real app)
        if: runner.os == 'Linux'
        run: scripts/ui_smoke.sh target/release/bdf shots
      - name: Package portable zip
        run: scripts/package.sh ${{ matrix.platform }}
      - name: Portable zip runs on its own
        # Unzipped into an empty folder, with no PDFium anywhere else to find:
        # the executable must bring its own engine.
        run: |
          lone="$RUNNER_TEMP/lone" && rm -rf "$lone" && mkdir -p "$lone"
          python3 -m zipfile -e dist/*.zip "$lone"
          if find "$lone" -iname '*pdfium*' ! -iname '*LICENSE*' | grep .; then
            echo "the zip ships a separate PDFium; it must be built into the executable"; exit 1
          fi
          app="$(find "$lone" -maxdepth 2 -type f \( -name bdf -o -name bdf.exe \))"
          chmod +x "$app"   # zipfile does not keep the executable bit
          unset BDF_PDFIUM BDF_DATA_DIR
          "$app" --generate 3 "$lone/t.pdf"
          "$app" --list-annotations "$lone/t.pdf"
          ls "$(dirname "$app")"/BDF-data/engine/*/
      - uses: actions/upload-artifact@v6
        # Also on failure: the report, log and screenshots are what explain it.
        # Best effort: a full Actions storage quota must not fail the build.
        if: always()
        continue-on-error: true
        with:
          name: BDF-${{ matrix.platform }}
          path: |
            dist/*.zip
            bench.json
            bench-data/bdf.log
            shots/*.png
          if-no-files-found: warn
          retention-days: 7

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [lint, build-test-bench]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: Checksums
        # Lets anyone confirm a download is intact, offline: sha256sum -c SHA256SUMS.txt
        run: |
          mkdir -p upload && cp artifacts/*/*.zip upload/
          (cd upload && sha256sum *.zip > SHA256SUMS.txt && cat SHA256SUMS.txt)
      - uses: softprops/action-gh-release@v2
        with:
          files: upload/*
